<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poker Osasco | Meus Bônus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0A; --bg2:#121212;
    --gold:#F2A93B; --gold-light:#FFD37A; --gold-deep:#B87A1E;
    --red:#C41E3A; --red-deep:#7A0E1F;
    --white:#FFFFFF; --muted:#9BA3A8;
    --line:rgba(255,255,255,.09); --panel:rgba(255,255,255,.035); --panel-strong:rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;min-height:100vh;background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(242,169,59,.10), transparent 60%),
      var(--bg);
    font-family:'Inter',sans-serif;color:var(--white);
    position:relative;overflow-x:hidden;
  }
  h1,h2,h3{font-family:'Oswald',sans-serif;margin:0;text-transform:uppercase;letter-spacing:.5px;}

  /* barra superior vermelha com brilho passando */
  .topline{position:fixed;top:0;left:0;width:100%;height:5px;z-index:50;
    background:linear-gradient(90deg,var(--red-deep),var(--red) 40%,var(--gold) 50%,var(--red) 60%,var(--red-deep));
    background-size:250% 100%;animation:sweep 5s linear infinite;}
  @keyframes sweep{0%{background-position:100% 0;}100%{background-position:-100% 0;}}

  /* naipes flutuando no fundo */
  .floaty{position:fixed;color:var(--gold);opacity:.05;pointer-events:none;z-index:0;font-size:180px;line-height:1;}
  .f1{top:-40px;left:-40px;animation:drift 22s ease-in-out infinite;}
  .f2{bottom:-60px;right:-30px;animation:drift 26s ease-in-out infinite reverse;}
  .f3{top:40%;right:-70px;font-size:130px;animation:drift 19s ease-in-out infinite;}
  @keyframes drift{0%,100%{transform:translateY(0) rotate(-6deg);}50%{transform:translateY(-26px) rotate(6deg);}}
  @media (prefers-reduced-motion: reduce){
    .topline,.floaty{animation:none !important;}
  }

  .wrap{max-width:560px;margin:0 auto;padding:44px 20px 90px;position:relative;z-index:1;}

  /* ---- Marca ---- */
  .marca{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:26px;}
  .badge{filter:drop-shadow(0 0 14px rgba(242,169,59,.35));animation:glow 4s ease-in-out infinite;}
  @keyframes glow{0%,100%{filter:drop-shadow(0 0 10px rgba(242,169,59,.25));}50%{filter:drop-shadow(0 0 20px rgba(242,169,59,.5));}}
  .marca .sub{font-size:.72rem;color:var(--muted);letter-spacing:3px;text-transform:uppercase;}

  .topbar{display:flex;align-items:center;justify-content:flex-end;margin-bottom:6px;}
  #btnSair{background:transparent;border:1px solid var(--line);color:var(--muted);
    padding:8px 16px;border-radius:4px;font-family:'Oswald',sans-serif;font-size:.78rem;
    letter-spacing:1px;text-transform:uppercase;cursor:pointer;}
  #btnSair:hover{border-color:var(--gold);color:var(--gold-light);}

  /* ---- Auth: carta com flip 3D ---- */
  .auth-stage{perspective:1400px;margin-top:4vh;}
  .auth-card{
    background:linear-gradient(180deg,var(--bg2),#0d0d0d);
    border:1px solid var(--line);border-radius:10px;padding:38px 32px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.4,.2,.2,1);
  }
  .auth-card.flip{transform:rotateY(90deg);}
  .auth-card::before{content:"";position:absolute;inset:0;border-radius:10px;pointer-events:none;
    background:linear-gradient(120deg,transparent 40%,rgba(242,169,59,.06) 50%,transparent 60%);}
  .auth-card{position:relative;}
  .auth-card h1{font-size:1.5rem;color:var(--gold-light);margin-bottom:6px;}
  .auth-card p.sub{color:var(--muted);margin:0 0 26px;font-size:.9rem;font-family:'Inter';text-transform:none;letter-spacing:0;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:.72rem;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px;}
  .field input{
    width:100%;padding:12px 14px;border-radius:6px;
    border:1px solid var(--line);background:#000;color:var(--white);
    font-family:'Inter',sans-serif;font-size:.95rem;
  }
  .field input:focus{outline:none;border-color:var(--gold);}
  .btn-primary{
    width:100%;padding:14px;border:none;border-radius:6px;position:relative;overflow:hidden;
    background:linear-gradient(180deg, var(--gold-light), var(--gold-deep));
    color:#1a1207;font-weight:700;font-size:.85rem;cursor:pointer;font-family:'Oswald',sans-serif;
    text-transform:uppercase;letter-spacing:1.5px;margin-top:6px;
  }
  .btn-primary::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(120deg,transparent,rgba(255,255,255,.55),transparent);
    transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite;pointer-events:none;}
  @keyframes shine{0%{left:-60%;}45%{left:120%;}100%{left:120%;}}
  .btn-primary:hover{filter:brightness(1.06);}
  .toggle-auth{text-align:center;margin-top:18px;font-size:.85rem;color:var(--muted);}
  .toggle-auth a{color:var(--gold-light);text-decoration:none;cursor:pointer;}
  .auth-msg{background:#2a0f14;border:1px solid var(--red);color:#f5c6cc;
    padding:10px 12px;border-radius:6px;font-size:.82rem;margin-bottom:16px;display:none;}

  /* ---- Dashboard ---- */
  .hello{color:var(--muted);font-size:.85rem;margin-bottom:14px;text-align:center;}
  .hello strong{color:var(--white);}
  .resumo{display:flex;gap:12px;margin:0 0 30px;}
  .resumo .card{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:16px;text-align:center;}
  .resumo .card .num{font-family:'Oswald',sans-serif;font-size:2.1rem;color:var(--gold);font-weight:700;}
  .resumo .card .lbl{font-size:.68rem;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:1px;}

  .bonus-card{
    background:linear-gradient(160deg,#1a1206 0%, var(--bg2) 45%, #0d0d0d 100%);
    border:1.5px solid var(--gold-deep);border-radius:10px;
    margin-bottom:20px;overflow:hidden;opacity:0;
    box-shadow:0 12px 30px rgba(0,0,0,.55), inset 0 0 0 1px rgba(242,169,59,.10);
    animation:dealIn .5s cubic-bezier(.2,.7,.3,1) forwards;
    position:relative;
  }
  @keyframes dealIn{from{opacity:0;transform:translateY(36px) rotate(-4deg) scale(.94);}
    to{opacity:1;transform:translateY(0) rotate(0) scale(1);}}
  .bonus-card::before{content:attr(data-suit);position:absolute;top:8px;right:14px;
    font-size:1.6rem;color:var(--gold);opacity:.14;pointer-events:none;z-index:1;}
  /* brilho holográfico passando pelo ticket, como um bilhete premium */
  .bonus-card::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(120deg,transparent,rgba(255,211,122,.16),transparent);
    transform:skewX(-20deg);animation:shine 6s ease-in-out infinite;pointer-events:none;}
  @media (prefers-reduced-motion: reduce){ .bonus-card::after{animation:none;} }

  /* selo "Chip Bonus" no canto, estilo ticket de torneio */
  .chip-badge{
    position:relative;z-index:2;display:inline-flex;align-items:center;gap:6px;
    margin:14px 0 -4px 14px;padding:4px 12px 4px 10px;border-radius:3px;
    background:linear-gradient(180deg,var(--gold-light),var(--gold-deep));
    color:#1a1207;font-family:'Oswald',sans-serif;font-weight:700;font-size:.62rem;
    letter-spacing:1.5px;text-transform:uppercase;box-shadow:0 3px 8px rgba(0,0,0,.4);
  }
  .bonus-head{padding:18px 18px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;
    align-items:flex-start;-webkit-tap-highlight-color:transparent;transition:transform .12s;}
  .bonus-head:active{transform:scale(.985);}
  .bonus-head .info h3{font-size:1.02rem;color:var(--white);margin-bottom:6px;letter-spacing:.2px;}
  .bonus-head .info .tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .tag{font-size:.65rem;padding:3px 10px;border-radius:3px;border:1px solid var(--line);color:var(--muted);
    text-transform:uppercase;letter-spacing:.6px;font-family:'Oswald',sans-serif;}
  .tag.valor{color:#1a1207;border-color:var(--gold);background:linear-gradient(180deg,var(--gold-light),var(--gold));font-weight:600;}
  .bonus-head .info .desc{font-size:.84rem;color:var(--muted);max-width:340px;font-family:'Inter';}
  .tap-hint{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:.72rem;
    color:var(--gold-light);font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.8px;}
  .tap-hint .finger{display:inline-block;animation:tapFinger 1.4s ease-in-out infinite;}
  @keyframes tapFinger{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
  .bonus-card.open .tap-hint{display:none;}
  @media (prefers-reduced-motion: reduce){ .tap-hint .finger{animation:none;} }

  .progress-ring-wrap{flex-shrink:0;text-align:center;}
  .tap-chip{width:46px;height:46px;border-radius:50%;margin:0 auto;display:flex;align-items:center;
    justify-content:center;background:linear-gradient(180deg,var(--gold-light),var(--gold-deep));
    box-shadow:0 4px 14px rgba(242,169,59,.4);animation:tapPulse 2s ease-in-out infinite;position:relative;}
  .bonus-card.open .tap-chip{animation:none;}
  .tap-chip .arrow{color:#1a1207;font-size:1.3rem;font-weight:700;transition:transform .25s;line-height:1;}
  .bonus-card.open .tap-chip .arrow{transform:rotate(180deg);}
  @keyframes tapPulse{
    0%,100%{box-shadow:0 4px 14px rgba(242,169,59,.4), 0 0 0 0 rgba(242,169,59,.5);}
    50%{box-shadow:0 4px 14px rgba(242,169,59,.6), 0 0 0 9px rgba(242,169,59,0);}
  }
  @media (prefers-reduced-motion: reduce){ .tap-chip{animation:none;} }
  .progress-track{height:5px;background:#000;border-radius:6px;overflow:hidden;margin-top:10px;width:96px;
    border:1px solid var(--line);}
  .progress-fill{height:100%;width:0%;transition:width .4s;
    background:linear-gradient(90deg,var(--gold-deep),var(--gold),var(--gold-light));
    background-size:200% 100%;animation:sweep 3s linear infinite;}
  .progress-pct{font-size:.68rem;color:var(--muted);margin-top:5px;font-family:'Oswald',sans-serif;}

  .bonus-body{max-height:0;overflow:hidden;transition:max-height .35s ease;
    border-top:2px dashed rgba(242,169,59,.35);position:relative;}
  .bonus-card.open .bonus-body{max-height:1400px;}
  /* furinhos de picote, como um canhoto de ticket de torneio */
  .bonus-body::before, .bonus-body::after{
    content:"";position:absolute;top:-8px;width:16px;height:16px;border-radius:50%;
    background:var(--bg);border:1.5px solid rgba(242,169,59,.35);z-index:2;
  }
  .bonus-body::before{left:-8px;}
  .bonus-body::after{right:-8px;}
  .bonus-body-inner{padding:18px 10px 22px;}
  .etapa{display:flex;align-items:center;gap:12px;padding:13px 8px;margin:0 8px;
    border-bottom:1px dashed var(--line);cursor:pointer;border-radius:6px;
    -webkit-tap-highlight-color:transparent;transition:background .15s;}
  .etapa:hover, .etapa:active{background:rgba(242,169,59,.06);}
  .etapa:last-child{border-bottom:none;}
  .etapa input[type=checkbox]{
    appearance:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);
    cursor:pointer;flex-shrink:0;position:relative;background:#000;
  }
  .etapa input[type=checkbox]:checked{background:var(--gold);border-color:var(--gold);animation:chipPulse .5s ease-out;}
  .etapa input[type=checkbox]:checked::after{content:"✓";position:absolute;inset:0;display:flex;
    align-items:center;justify-content:center;font-size:15px;color:#1a1207;font-weight:700;}
  @keyframes chipPulse{0%{box-shadow:0 0 0 0 rgba(242,169,59,.65);}100%{box-shadow:0 0 0 12px rgba(242,169,59,0);}}
  .etapa .txt{font-size:.92rem;color:var(--white);}
  .etapa.done .txt{color:var(--muted);text-decoration:line-through;}
  .validade{font-size:.74rem;color:var(--muted);margin-top:14px;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;}
  .regras{font-size:.78rem;color:var(--muted);margin-top:8px;font-style:italic;}

  .concluido-badge{
    display:inline-block;margin-top:14px;font-family:'Oswald',sans-serif;font-weight:700;
    font-size:.78rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--red);
    border:2px solid var(--red);padding:6px 16px;border-radius:3px;transform:rotate(-4deg);
    animation:stampIn .4s cubic-bezier(.3,1.6,.5,1) both;
  }
  @keyframes stampIn{0%{transform:scale(2.4) rotate(-14deg);opacity:0;}
    60%{transform:scale(.92) rotate(-2deg);opacity:1;}100%{transform:scale(1) rotate(-4deg);opacity:1;}}

  .vazio{text-align:center;color:var(--muted);padding:60px 20px;font-size:.9rem;}
</style>
</head>
<body>
<div class="topline"></div>
<div class="floaty f1">♠</div>
<div class="floaty f2">♣</div>
<div class="floaty f3">♦</div>

<div class="wrap">

  <div class="topbar"><button id="btnSair" style="display:none;">Sair</button></div>

  <div class="marca">
    <svg class="badge" width="78" height="78" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="56" fill="#111" stroke="#F2A93B" stroke-width="2.5"/>
      <circle cx="60" cy="60" r="48" fill="none" stroke="#5a4419" stroke-width="1"/>
      <g fill="#F2A93B" font-size="15" text-anchor="middle">
        <text x="33" y="36" transform="rotate(-20 33 36)">♣</text>
        <text x="49" y="24" transform="rotate(-7 49 24)">♦</text>
        <text x="71" y="24" transform="rotate(7 71 24)">♥</text>
        <text x="87" y="36" transform="rotate(20 87 36)">♠</text>
      </g>
      <text x="60" y="65" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="13" fill="#fff" letter-spacing="1">POKER</text>
      <text x="60" y="80" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="11" fill="#F2A93B" letter-spacing="2">OSASCO</text>
      <path d="M38 90 L60 99 L82 90" stroke="#F2A93B" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M38 99 L60 108 L82 99" stroke="#B87A1E" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="sub">Meus Bônus</div>
  </div>

  <!-- TELA DE AUTENTICAÇÃO -->
  <div class="auth-stage">
  <div id="telaAuth" class="auth-card">
    <div id="authMsg" class="auth-msg"></div>

    <div id="formLogin">
      <h1>Entrar</h1>
      <p class="sub">Acesse sua conta para ver seus bônus.</p>
      <div class="field"><label>E-mail</label><input type="email" id="loginEmail" placeholder="seuemail@exemplo.com"></div>
      <div class="field"><label>Senha</label><input type="password" id="loginSenha" placeholder="••••••••"></div>
      <button class="btn-primary" onclick="fazerLogin()">Entrar</button>
      <p class="toggle-auth">Ainda não tem conta? <a onclick="trocarForm('cadastro')">Criar conta</a></p>
    </div>

    <div id="formCadastro" style="display:none;">
      <h1>Criar conta</h1>
      <p class="sub">Leva menos de um minuto.</p>
      <div class="field"><label>Nome</label><input type="text" id="cadNome" placeholder="Seu nome"></div>
      <div class="field"><label>E-mail</label><input type="email" id="cadEmail" placeholder="seuemail@exemplo.com"></div>
      <div class="field"><label>Senha</label><input type="password" id="cadSenha" placeholder="Mínimo 6 caracteres"></div>
      <button class="btn-primary" onclick="fazerCadastro()">Criar conta</button>
      <p class="toggle-auth">Já tem conta? <a onclick="trocarForm('login')">Entrar</a></p>
    </div>
  </div>
  </div>

  <!-- TELA DO APP -->
  <div id="telaApp" style="display:none;">
    <p class="hello">Bem-vindo, <strong id="nomeUsuario"></strong></p>
    <div class="resumo">
      <div class="card"><div class="num" id="resTotal">0</div><div class="lbl">Bônus disponíveis</div></div>
      <div class="card"><div class="num" id="resConcluidos">0</div><div class="lbl">Concluídos</div></div>
    </div>
    <div id="listaBonus"></div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script>
let bonusData = {};
let progressoData = {};
let uidAtual = null;
const SUITS = ['♠','♥','♦','♣'];

function mostrarErro(msg){ const el=document.getElementById('authMsg'); el.textContent=msg; el.style.display='block'; }
function limparErro(){ document.getElementById('authMsg').style.display='none'; }

function trocarForm(destino){
  limparErro();
  const card = document.getElementById('telaAuth');
  card.classList.add('flip');
  setTimeout(()=>{
    document.getElementById('formLogin').style.display = destino==='login' ? 'block' : 'none';
    document.getElementById('formCadastro').style.display = destino==='cadastro' ? 'block' : 'none';
    card.classList.remove('flip');
  }, 260);
}

function fazerCadastro(){
  limparErro();
  const nome = document.getElementById('cadNome').value.trim();
  const email = document.getElementById('cadEmail').value.trim();
  const senha = document.getElementById('cadSenha').value;
  if(!nome || !email || !senha){ mostrarErro('Preencha todos os campos.'); return; }
  if(senha.length < 6){ mostrarErro('A senha precisa ter no mínimo 6 caracteres.'); return; }

  auth.createUserWithEmailAndPassword(email, senha)
    .then(cred => db.ref('usuarios/' + cred.user.uid).set({ nome, email, criadoEm: Date.now() }))
    .catch(err => mostrarErro(traduzErro(err.code)));
}

function fazerLogin(){
  limparErro();
  const email = document.getElementById('loginEmail').value.trim();
  const senha = document.getElementById('loginSenha').value;
  if(!email || !senha){ mostrarErro('Preencha e-mail e senha.'); return; }
  auth.signInWithEmailAndPassword(email, senha).catch(err => mostrarErro(traduzErro(err.code)));
}

document.getElementById('btnSair').addEventListener('click', () => auth.signOut());

function traduzErro(code){
  const mapa = {
    'auth/email-already-in-use':'Este e-mail já está cadastrado.',
    'auth/invalid-email':'E-mail inválido.',
    'auth/weak-password':'Senha muito fraca (mínimo 6 caracteres).',
    'auth/user-not-found':'Conta não encontrada.',
    'auth/wrong-password':'Senha incorreta.',
    'auth/invalid-credential':'E-mail ou senha incorretos.'
  };
  return mapa[code] || 'Ocorreu um erro. Tente novamente.';
}

auth.onAuthStateChanged(user => {
  if(user){
    uidAtual = user.uid;
    document.getElementById('telaAuth').parentElement.style.display = 'none';
    document.querySelector('.marca .sub').textContent = 'Meus Bônus';
    document.getElementById('telaApp').style.display = 'block';
    document.getElementById('btnSair').style.display = 'inline-block';

    db.ref('usuarios/' + uidAtual + '/nome').once('value').then(snap => {
      document.getElementById('nomeUsuario').textContent = snap.val() || user.email;
    });

    db.ref('bonus').on('value', snap => { bonusData = snap.val() || {}; renderizar(); });
    db.ref('usuarios/' + uidAtual + '/progresso').on('value', snap => { progressoData = snap.val() || {}; renderizar(); });
  } else {
    uidAtual = null;
    document.getElementById('telaApp').style.display = 'none';
    document.getElementById('telaAuth').parentElement.style.display = 'block';
    document.getElementById('btnSair').style.display = 'none';
  }
});

function renderizar(){
  const lista = document.getElementById('listaBonus');
  const ids = Object.keys(bonusData)
    .filter(id => bonusData[id].ativo !== false)
    .sort((a,b) => (bonusData[a].ordem||0) - (bonusData[b].ordem||0));

  if(ids.length === 0){
    lista.innerHTML = '<div class="vazio">Nenhum bônus disponível no momento. Volte em breve.</div>';
    document.getElementById('resTotal').textContent = '0';
    document.getElementById('resConcluidos').textContent = '0';
    return;
  }

  let concluidosCount = 0;
  let html = '';

  ids.forEach((id, idx) => {
    const b = bonusData[id];
    const etapas = b.etapas || {};
    const etapaIds = Object.keys(etapas).sort((a,b2)=>(etapas[a].ordem||0)-(etapas[b2].ordem||0));
    const progressoBonus = (progressoData[id]) || {};
    const totalEtapas = etapaIds.length;
    const feitas = etapaIds.filter(eid => progressoBonus[eid]).length;
    const pct = totalEtapas ? Math.round((feitas/totalEtapas)*100) : 0;
    if(pct === 100 && totalEtapas > 0) concluidosCount++;

    html += `
      <div class="bonus-card" id="card-${id}" data-suit="${SUITS[idx % 4]}" style="animation-delay:${idx*0.08}s">
        <div class="chip-badge">🪙 Chip Bonus</div>
        <div class="bonus-head" onclick="toggleCard('${id}')">
          <div class="info">
            <h3>${escapeHtml(b.titulo || 'Bônus')}</h3>
            <div class="tags">
              ${b.plataforma ? `<span class="tag">${escapeHtml(b.plataforma)}</span>` : ''}
              ${b.categoria ? `<span class="tag">${escapeHtml(b.categoria)}</span>` : ''}
              ${b.valor ? `<span class="tag valor">${escapeHtml(b.valor)}</span>` : ''}
            </div>
            ${b.descricao ? `<div class="desc">${escapeHtml(b.descricao)}</div>` : ''}
            <div class="tap-hint"><span class="finger">👆</span> Toque no ticket para ver o checklist</div>
          </div>
          <div class="progress-ring-wrap">
            <div class="tap-chip"><span class="arrow">▾</span></div>
            <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
            <div class="progress-pct">${feitas}/${totalEtapas}</div>
          </div>
        </div>
        <div class="bonus-body">
          <div class="bonus-body-inner">
            ${etapaIds.map(eid => {
              const feita = !!progressoBonus[eid];
              return `<label class="etapa ${feita?'done':''}">
                <input type="checkbox" ${feita?'checked':''} onclick="marcarEtapa('${id}','${eid}',this.checked)">
                <span class="txt">${escapeHtml(etapas[eid].texto || '')}</span>
              </label>`;
            }).join('')}
            ${pct===100 && totalEtapas>0 ? '<div class="concluido-badge">✓ Concluído</div>' : ''}
            ${b.validade ? `<div class="validade">Válido até ${escapeHtml(b.validade)}</div>` : ''}
            ${b.regras ? `<div class="regras">${escapeHtml(b.regras)}</div>` : ''}
          </div>
        </div>
      </div>`;
  });

  lista.innerHTML = html;
  document.getElementById('resTotal').textContent = ids.length;
  document.getElementById('resConcluidos').textContent = concluidosCount;
}

function toggleCard(id){ document.getElementById('card-'+id).classList.toggle('open'); }
function marcarEtapa(bonusId, etapaId, valor){ db.ref(`usuarios/${uidAtual}/progresso/${bonusId}/${etapaId}`).set(valor); }
function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }
</script>
</body>
</html>
